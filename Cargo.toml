[package]
name = "paneldeck"
version = "2.4.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11"] }
alacritty_terminal = "0.26"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Deflate zum Entpacken des portablen Release-ZIPs beim Selbst-Update (über `png` ohnehin schon im Baum, keine neue Crate).
miniz_oxide = "0.8"

[features]
# Nur für die README-Screenshots (tools/readme-shots.ps1): Startansicht per Umgebungsvariable PANELDECK_SHOT. Nie im Release.
readme-shots = []
# Nur für den lokalen Ende-zu-Ende-Test des Selbst-Updates: Release-Feed aus einem Ordner (PANELDECK_UPDATE_TEST_FEED, siehe
# tools/update-feed.sh). Nie im Release (tools/release.sh prüft das).
update-test-feed = []

[build-dependencies]
embed-resource = "3"

[target.'cfg(unix)'.dependencies]
# „Lebt die PID noch?“ (`src/platform/process.rs`, `kill(pid, 0)`); steckt über portable-pty ohnehin schon im Baum.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
tray-icon = { version = "0.21", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Environment", "Win32_System_Registry", "Win32_Security", "Win32_Security_Cryptography", "Win32_Networking_WinHttp", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Com"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
rfd = { version = "0.17", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

# portable-pty mit kleinem Patch (vendor/portable-pty/PANELDECK-PATCH.md): mitgelieferte conpty.dll per vollem Pfad
# statt per Name laden, Wahl je Sitzung, Rückfall auf die ConPTY von Windows.
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
