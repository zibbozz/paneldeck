[package]
name = "paneldeck"
version = "3.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
alacritty_terminal = "0.26"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
ttf-parser = "0.25"
# Bilder in Chats (#357): PNG, JPEG (zune-jpeg steckt über tiff ohnehin im Baum) und BMP (ohne eigene Crate).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Deflate zum Entpacken des portablen Release-ZIPs beim Selbst-Update (über `png` ohnehin schon im Baum, keine neue Crate).
miniz_oxide = "0.8"
# Bild aus der Zwischenablage (`platform::clipboard`; Linux: X11 bzw. XWayland).
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Regex-Suche des Chat-Werkzeugs `grep` (#338); steckt über alacritty_terminal ohnehin im Baum (keine neue Crate).
regex-automata = "0.4"
# Editor-Tab (#54, `src/editor/`): Rope-Text (nur LF als Zeilenende, keine Unicode-Zeilentrenner), Suchen/Ersetzen mit
# regulären Ausdrücken, Kodierungen (UTF-16, Windows-1252), Unterschied Datei/Puffer, Graphem-Grenzen und Spaltenbreiten.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
regex = "1"
encoding_rs = "0.8"
similar = "2"
unicode-segmentation = "1"
unicode-width = "0.2"
# Editor (#54): Suche in Dateien – Ordner durchlaufen mit .gitignore-Regeln (ignore, MIT/Unlicense, aus ripgrep).
ignore = "0.4"
# Editor, Syntax-Modus (#312): Syntaxfarben mit syntect (Sublime-Grammatiken, reines Rust über fancy-regex, kein Oniguruma)
# und den Grammatiken von bat (two-face). Eigene Grammatiken für AutoIt, Inno Setup, Visual Basic, PowerShell: src/editor/syntax/grammars/.
syntect = { version = "5.3", default-features = false, features = ["parsing", "yaml-load", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[features]
# Nur für die README- und Doku-Screenshots (tools/docs-shots.ps1): Startansicht per Umgebungsvariable PANELDECK_SHOT. Nie im Release.
readme-shots = []
# Nur für den lokalen Ende-zu-Ende-Test des Selbst-Updates: Release-Feed aus einem Ordner (PANELDECK_UPDATE_TEST_FEED, siehe
# tools/update-feed.sh). Nie im Release (tools/release.sh prüft das).
update-test-feed = []
# Nur für den Smoke-Test des Tutorials (#143, tools/smoke-mcp.ps1 -TutorialExe): Zustand und Befehle über Dateien im Ordner
# PANELDECK_TUTORIAL_TEST (src/app/tutorial/hook.rs). Nie im Release (tools/release.sh prüft das).
tutorial-test = []

[build-dependencies]
embed-resource = "3"

[target.'cfg(unix)'.dependencies]
# „Lebt die PID noch?“ (`src/platform/process.rs`, `kill(pid, 0)`), libproc/sysctl unter macOS (`src/platform/unix_proc.rs`);
# steckt über portable-pty ohnehin schon im Baum.
libc = "0.2"
# HTTPS außerhalb von Windows (#149): reines Rust (ureq + rustls/ring), Stammzertifikate aus dem System (rustls-native-certs),
# ohne gzip/Cookies/Weiterleitungen (`app/update/http/rustls.rs`, `llm/http/rustls.rs`, `platform::tls`).
ureq = { version = "2.12", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# Verschlüsselung der API-Schlüssel (ChaCha20-Poly1305, PBKDF2 für das Master-Passwort; `platform::secret`); kommt mit rustls.
ring = "0.17"
# Passwort und Schlüssel im Speicher nach Gebrauch überschreiben (steckt über secret-service ohnehin im Baum).
zeroize = "1"

# Linux-Desktop (#149): Schlüsselbund (Secret Service), Tray (StatusNotifierItem), Benachrichtigungen – alles über D-Bus
# in reinem Rust (zbus), keine GTK-/libdbus-Abhängigkeit beim Bauen.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# Benachrichtigungen: org.freedesktop.Notifications direkt über zbus (dieselbe Version wie ksni/secret-service).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Native Datei-/Ordnerdialoge über das XDG-Desktop-Portal (GNOME, KDE, …; reines Rust, kein GTK).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# macOS (#150): Schlüsselbund (Keychain; steckt über rustls-native-certs ohnehin im Baum), Menüleisten-Symbol (tray-icon,
# NSStatusItem) und native Datei-/Ordnerdialoge (rfd, NSOpenPanel/NSSavePanel).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
tray-icon = { version = "0.21", default-features = false }
rfd = { version = "0.17", default-features = false }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
tray-icon = { version = "0.21", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Environment", "Win32_System_Registry", "Win32_Security", "Win32_Security_Cryptography", "Win32_Networking_WinHttp", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_Storage_FileSystem"] }
rfd = { version = "0.17", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

# portable-pty mit kleinem Patch (vendor/portable-pty/PANELDECK-PATCH.md): mitgelieferte conpty.dll per vollem Pfad
# statt per Name laden, Wahl je Sitzung, Rückfall auf die ConPTY von Windows.
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
